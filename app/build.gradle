plugins {
    alias(libs.plugins.android.application)
}

def robolectricJvmArgs = [
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
]

android {
    namespace = 'com.github.catvod'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "com.github.catvod.demo"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        buildConfigField "String", "CLIENT_ID", "\"\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java {
                                                                                exclude 'com/github/catvod/spider/XBPQ.java'
                exclude 'com/github/catvod/spider/XBPQPlay.java'
                exclude 'com/github/catvod/spider/XYQHiker.java'
                exclude 'com/github/catvod/spider/XYQBiu.java'
                exclude 'com/github/catvod/spider/PushAgent.java'
                exclude 'com/github/catvod/spider/Danmu.java'
                exclude 'com/github/catvod/spider/AppGet.java'
                exclude 'com/github/catvod/spider/AppYs.java'
                exclude 'com/github/catvod/spider/AppMuou.java'
                exclude 'com/github/catvod/spider/Czsapp.java'
                exclude 'com/github/catvod/spider/QnMp4.java'
                exclude 'com/github/catvod/spider/YGP.java'
                exclude 'com/github/catvod/spider/XunleiPan.java'
                exclude 'com/github/catvod/spider/AppQi.java'
                exclude 'com/github/catvod/spider/AppSy.java'
                exclude 'com/github/catvod/spider/Feiyu.java'
                exclude 'com/github/catvod/spider/support/p117b/C2155P.java'
                exclude 'com/github/catvod/spider/support/p105K/C2071d.java'
                exclude 'com/github/catvod/spider/support/p002A0/C0720wl.java'
                exclude 'com/github/catvod/spider/support/p002A0/aag.java'
                exclude 'com/github/catvod/spider/support/p002A0/abe.java'
                exclude 'com/github/catvod/spider/support/p002A0/C0577rd.java'
                exclude 'com/github/catvod/spider/support/p044FM/p090o/C1885z.java'
                exclude 'com/github/catvod/spider/support/p044FM/p051G/C1366t.java'
                exclude 'com/github/catvod/spider/support/p044FM/p065U/C1632D.java'
                exclude 'com/github/catvod/spider/support/p003AB/p009o/C0921c0.java'
                exclude 'com/github/catvod/spider/support/p012C0/p031g0/C1232D.java'

                // use maven protobuf, not incomplete decompiled stubs
                                            }
        }
    }


    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            jvmArgs += robolectricJvmArgs
            outputs.upToDateWhen { false }
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force "com.squareup.okhttp3:okhttp:${libs.versions.okhttp.get()}"
        }
    }
}

dependencies {
    compileOnly libs.androidx.annotation
    implementation libs.okhttp
    implementation libs.sardine.android
    implementation libs.quickjs.wrapper
    implementation libs.gson
    implementation libs.smbj
    implementation libs.jsoup
    implementation "com.google.protobuf:protobuf-java:4.28.2"
    implementation "org.slf4j:slf4j-nop:2.0.16"
    implementation "org.slf4j:slf4j-api:2.0.16"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "com.google.zxing:core:3.5.3"
    testImplementation libs.junit
    testImplementation libs.robolectric
}

tasks.register('siteTest') {
    group = 'verification'
    dependsOn 'testDebugUnitTest'
}
